name: Primeiro APK
on:
  push:
    branches: [main, dev/primeiro-apk, fix/login-video-playback]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Configure own Google client (optional repository variable)
        env:
          GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID }}
        shell: bash
        run: |
          mkdir -p "$HOME/.gradle"
          if [ -n "$GOOGLE_WEB_CLIENT_ID" ]; then
            [[ "$GOOGLE_WEB_CLIENT_ID" =~ ^[A-Za-z0-9.-]+\.apps\.googleusercontent\.com$ ]]
            printf '\ngoogleWebClientId=%s\n' "$GOOGLE_WEB_CLIENT_ID" >> "$HOME/.gradle/gradle.properties"
          fi
      - name: Compile, test and lint
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :core:test :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace --console=plain 2>&1 | tee build.log
      - name: APK Debug
        if: github.event.repository.private == true
        uses: actions/upload-artifact@v4
        with:
          name: projeto-5369-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
      - name: Private distribution notice
        if: github.event.repository.private != true
        run: echo "APK compiled. Upload disabled because this repository is public and APK distribution must remain private." >> "$GITHUB_STEP_SUMMARY"
      - name: Logs and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            build.log
            **/build/reports/
            **/build/test-results/
          retention-days: 7
  navigation:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Navigation and persistence smoke tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: bash -c 'set +e; ./gradlew :app:connectedDebugAndroidTest --stacktrace --console=plain; result=$?; mkdir -p ui-shots; for name in ui-home.png ui-watch.png; do adb exec-out run-as dev.projeto5369 cat files/$name > ui-shots/$name; done; exit $result'
      - name: Device test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: device-test-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            ui-shots/
          retention-days: 7

  live-youtube:
    name: Reprodução real YouTube (diagnóstico externo)
    if: github.ref == 'refs/heads/fix/login-video-playback'
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Official player must advance real video time
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.ytLive=true -Pandroid.testInstrumentationRunnerArguments.class=dev.projeto5369.LiveYouTubePlaybackTest --console=plain
      - name: Actual platform result (separate from deterministic tests)
        if: always()
        run: |
          echo 'Live YouTube playback is a separate diagnostic. A failed check does not validate playback; inspect this job and its reports. Datacenter restrictions must not be bypassed.' >> "$GITHUB_STEP_SUMMARY"
      - name: Live player reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-youtube-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          retention-days: 7
