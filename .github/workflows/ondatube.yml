name: OndaTube (teste ao vivo)
on:
  push:
    branches: [onda-tube]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ondatube-${{ github.ref }}
  cancel-in-progress: true
jobs:
  live:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Build, unit tests and live search
        shell: bash
        run: |
          mkdir -p out
          set -o pipefail
          ./gradlew :core:test -Pyt.live=true :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest --console=plain 2>&1 | tee out/build.log
          echo "${PIPESTATUS[0]}" > out/build.status
        continue-on-error: true
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Device tests (navigation + real YouTube playback)
        uses: reactivecircus/android-emulator-runner@v2
        continue-on-error: true
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.ytLive=true -Pandroid.injected.androidTest.leaveApksInstalledAfterRun=true --console=plain > out/device.log 2>&1; echo $? > out/device.status
            mkdir -p out/shots; for f in $(adb shell run-as dev.projeto5369 ls files 2>/dev/null | tr -d '\r' | grep png); do adb exec-out run-as dev.projeto5369 cat files/$f > out/shots/$f; done; ls -la out/shots
            adb logcat -d -t 40000 > out/logcat.txt 2>&1 || true; grep -E 'P5369|chromium|cr_|\[playback\]|\[tap\]' out/logcat.txt > out/logcat-player.txt || true
      - name: Collect reports and encrypt APK
        if: always()
        shell: bash
        run: |
          mkdir -p out/reports
          cp -r core/build/test-results out/reports/core 2>/dev/null || true
          cp -r app/build/outputs/androidTest-results out/reports/device 2>/dev/null || true
          cp -r app/build/outputs/connected_android_test_additional_output out/shots-extra 2>/dev/null || true
          APK=app/build/outputs/apk/debug/app-debug.apk
          if [ -f "$APK" ]; then sha256sum "$APK" > out/apk.sha256; openssl cms -encrypt -binary -aes256 -in "$APK" -outform DER -out out/app-debug.apk.cms ci/apk-recipient.pem; fi
          echo "${GITHUB_SHA}" > out/commit.txt
      - name: Publish results branch
        if: always()
        shell: bash
        run: |
          cd out
          git init -q -b ci-out/onda-tube
          git config user.name "ondatube-ci"; git config user.email "ci@users.noreply.github.com"
          git add -A; git commit -qm "CI results for ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-out/onda-tube
      - name: Fail if something failed
        if: always()
        shell: bash
        run: |
          b=$(cat out/build.status 2>/dev/null || echo 1); d=$(cat out/device.status 2>/dev/null || echo 1)
          echo "build=$b device=$d"; [ "$b" = "0" ] && [ "$d" = "0" ]
